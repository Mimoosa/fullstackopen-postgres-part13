name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TESTING: "true"
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/test_db
      PORT: 3001
      SECRET: test_secret

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Start application
        run: |
          TESTING=true \
          TEST_DATABASE_URL=${{ env.TEST_DATABASE_URL }} \
          node backend/index.js > app.log 2>&1 &

      - name: Wait for application to be ready
        run: npx wait-on tcp:3001 -t 30000

      - name: Run tests
        run: npm test

      - name: Print application logs on failure
        if: failure()
        run: cat app.log
